# pt_br: keys missing here fall back to en_us.
locale:
  name: 'Português (Brasil)'
  iso_code: 'pt-BR'
errors:
  usage:
    message: 'Uso inválido: {detail}'
    hint: 'Execute "mothdex {command} --help".'
  invalid_config:
    message: 'Configuração inválida {key}={value} (origem: {source}).'
    hint: 'Execute "mothdex config reset {key}".'
  invalid_request:
    message: 'Requisição inválida: {detail}.'
    hint: 'Confira o slug, os filtros e os valores informados.'
  confirmation_required:
    message: 'Este comando precisa de confirmação.'
    hint: 'Adicione --force para pular a pergunta.'
  unmapped_platform:
    message: 'Nenhuma pasta definida para a plataforma {platform}.'
    hint: 'Use -o <pasta>, ou defina profile.folders.{platform} na configuração.'
  no_session:
    message: 'Não há busca anterior para referenciar.'
    hint: 'Execute "mothdex search <texto>" primeiro, ou use --slug.'
  index_out_of_range:
    message: 'O resultado nº {index} não existe (a última busca tem {count}).'
    hint: 'Escolha um número entre 1 e {count}.'
  not_found:
    message: 'Nenhuma entrada encontrada para {ref}.'
    hint: 'Confira a grafia ou busque com menos palavras.'
  network:
    message: 'Não foi possível alcançar o servidor do Mothdex.'
    hint: 'Verifique sua conexão.'
  rate_limited:
    message: 'O servidor pediu para diminuirmos o ritmo.'
    hint: 'Aguarde {retry_after} e tente de novo.'
  upstream:
    message: 'O servidor teve um problema (HTTP {status}).'
    hint: 'Tente de novo em alguns minutos.'
  api_incompatible:
    message: 'O servidor respondeu em um formato que esta versão não entende.'
    hint: 'Atualize o mothdex.'
  untrusted_url:
    message: 'Download recusado de {host}.'
    hint: 'Só {allowed} é confiável.'
  untrusted_redirect:
    message: 'O servidor redirecionou para {host}, que não é confiável.'
    hint: 'Nada foi enviado para lá. Tente de novo mais tarde; se persistir, relate o problema.'
  size_mismatch:
    message: 'O arquivo baixado tem tamanho errado ({got} de {expected}).'
    hint: 'Tente de novo, ou escolha outro link com --link.'
  integrity:
    message: 'O arquivo baixado está corrompido (a verificação do arquivo falhou).'
    hint: 'Tente de novo, ou escolha outro link com --link.'
  permission_denied:
    message: 'Não foi possível gravar em {path}.'
    hint: 'Escolha outra pasta com -o, ou corrija as permissões dela.'
  disk_full:
    message: 'Não há espaço livre suficiente em {path} (precisa de {needed}).'
    hint: 'Libere espaço ou escolha outra pasta com -o.'
  exists:
    message: '{path} já existe.'
    hint: 'Defina download.on_exists como rename ou overwrite.'
  path_rejected:
    message: 'Recusando gravar em {path}.'
    hint: 'Nada foi gravado. Escolha outra pasta com -o, ou confira profile.folders.'
  unsafe_name:
    message: 'Recusando salvar {name}: o tipo de arquivo pode executar código.'
    hint: 'Nada foi gravado. Escolha outro link com --link, ou use --allow-executable se confiar nele.'
  canceled:
    message: 'Cancelado.'
    hint: ''
  internal:
    message: 'Erro inesperado.'
    hint: 'Os detalhes estão em {log_path}. Por favor, relate o problema.'
