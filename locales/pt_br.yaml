# pt_br: keys missing here fall back to en_us.
locale:
  name: 'Português (Brasil)'
  iso_code: 'pt-BR'
errors:
  update_unavailable:
    message: 'Esta instalação não pode ser atualizada pelo mothdex.'
    hint: 'Instale com o comando de uma linha para seu sistema: {install_command}'
  update_failed:
    message: 'Não foi possível concluir a atualização.'
    hint: 'Se a versão anterior foi restaurada, tente mothdex upgrade mais tarde; caso contrário, reinstale: {install_command}'
  usage:
    message: 'Uso inválido: {detail}'
    hint: 'Execute "mothdex {command} --help".'
  invalid_config:
    message: 'Configuração inválida {key}={value} (origem: {source}).'
    hint: 'Execute "mothdex config reset {key}".'
  invalid_request:
    message: 'Requisição inválida: {detail}.'
    hint: 'Confira o slug, os filtros e os valores informados.'
  confirmation_required:
    message: 'Este comando precisa de confirmação.'
    hint: 'Adicione --force para pular a pergunta.'
    size_hint: 'O arquivo tem {size}; o catálogo indicava {estimate}. Ele precisa da sua confirmação para ser baixado.'
    size_hint_cli: 'O arquivo tem {size}; o catálogo indicava {estimate}. Use -f para baixar mesmo assim.'
  unmapped_platform:
    message: 'Nenhuma pasta definida para a plataforma {platform}.'
    hint: 'Use -o <pasta>, ou defina profile.folders.{platform} na configuração.'
  no_session:
    message: 'Não há busca anterior para referenciar.'
    hint: 'Execute "mothdex search <texto>" primeiro, ou use --slug.'
  index_out_of_range:
    message: 'O resultado nº {index} não existe (a última busca tem {count}).'
    hint: 'Escolha um número entre 1 e {count}.'
  not_found:
    message: 'Nenhuma entrada encontrada para {ref}.'
    hint: 'Confira a grafia ou busque com menos palavras.'
  network:
    message: 'Não foi possível alcançar o servidor do Mothdex.'
    hint: 'Verifique sua conexão.'
  rate_limited:
    message: 'O servidor pediu para diminuirmos o ritmo.'
    hint: 'Aguarde {retry_after} e tente de novo.'
  upstream:
    message: 'O servidor teve um problema (HTTP {status}).'
    hint: 'Tente de novo em alguns minutos.'
  api_incompatible:
    message: 'O servidor respondeu em um formato que esta versão não entende.'
    hint: 'Atualize o mothdex.'
  untrusted_url:
    message: 'Download recusado de {host}.'
    hint: 'Só {allowed} é confiável.'
  untrusted_redirect:
    message: 'O servidor redirecionou para {host}, que não é confiável.'
    hint: 'Nada foi enviado para lá. Tente de novo mais tarde; se persistir, relate o problema.'
  size_mismatch:
    message: 'O arquivo baixado tem tamanho errado ({got} de {expected}).'
    hint: 'Tente de novo, ou escolha outro link com --link.'
  integrity:
    message: 'O arquivo baixado está corrompido (a verificação do arquivo falhou).'
    hint: 'Tente de novo, ou escolha outro link com --link.'
  permission_denied:
    message: 'Não foi possível gravar em {path}.'
    hint: 'Escolha outra pasta com -o, ou corrija as permissões dela.'
  disk_full:
    message: 'Não há espaço livre suficiente em {path} (precisa de {needed}).'
    hint: 'Libere espaço ou escolha outra pasta com -o.'
  exists:
    message: '{path} já existe.'
    hint: 'Defina download.on_exists como rename ou overwrite.'
  path_rejected:
    message: 'Recusando gravar em {path}.'
    hint: 'Nada foi gravado. Escolha outra pasta com -o, ou confira profile.folders.'
    missing_hint: '{path} não existe. Crie a pasta, use -o <pasta> ou execute: mothdex config set download.dir <pasta>'
  unsafe_name:
    message: 'Recusando salvar {name}: o tipo de arquivo pode executar código.'
    hint: 'Nada foi gravado. Escolha outro link com --link, ou use --allow-executable se confiar nele.'
  canceled:
    message: 'Cancelado.'
    hint: ''
  internal:
    message: 'Erro inesperado.'
    hint: 'Os detalhes estão em {log_path}. Por favor, relate o problema.'
ui:
  logs:
    code: 'código'
    log: 'log'
    bad_tail: '--tail deve estar entre 0 e {max}.'
    bad_ref: 'O ref são os 6 caracteres mostrados junto do erro, por exemplo 7F3K2Q.'
    bad_session: 'Sessão inexistente. Use um id de mothdex logs list.'
    bad_sessions: '--sessions deve estar entre 1 e {max}.'
    bad_folder: '-o precisa ser uma pasta existente, não um link.'
    need_target: 'Informe o id de uma sessão ou --ref <ref>.'
    no_previous: 'Não há sessão anterior.'
    no_ref: 'Nenhuma sessão tem o ref {ref}.'
    no_permissions: 'A pasta de logs não tem permissões de arquivo (FAT, exFAT ou NTFS): outros usuários desta máquina podem ler os logs.'
    list_hint: 'Rode mothdex logs list para ver as sessões.'
    match: 'Sessão {session}, linha {line}'
    cannot_open: 'Não é possível abrir um gerenciador de arquivos aqui. Os logs estão em {path}'
    bundle_next: 'Pacote gravado ({size}). Revise e anexe a um relato de erro; veja mothdex help logs.'
    clear_ask: 'Apagar as sessões, os arquivos de crash e os pacotes em {path}? [s/N]'
    cleared: 'Apagados: {sessions} sessões, {crashes} arquivos de crash, {bundles} pacotes.'
    column:
      session: 'Sessão'
      started: 'Início'
      binary: 'Programa'
      mode: 'Modo'
      duration: 'Duração'
      errors: 'Erros'
    topic: |-
      Cada execução grava o próprio log.

        logs/latest.log        a execução mais recente
        logs/sessions/         um arquivo por execução
        logs/crash/            stack traces, só depois de uma falha grave
        logs/mothdex.log       histórico geral

      mothdex logs path mostra a pasta: %LocalAppData%\mothdex\logs no Windows,
      ~/.local/state/mothdex/logs no Linux e ~/Library/Logs/mothdex no macOS.

      Para relatar um erro:
        1. Anote o ref mostrado junto dele (6 caracteres).
        2. mothdex logs show --ref <ref>   mostra o que aconteceu em volta
        3. mothdex logs bundle             gera um zip para anexar
        4. Revise o zip (a issue é pública) e abra
           https://github.com/Or4cu1o/mothdex-cli/issues/new?template=bug.yml

      Tokens, o endereço da API e a sua pasta de usuário são removidos do que vai no pacote.
      Configurações: log.session_level (debug durante o beta) e log.sessions_keep (20).
  storage:
    rom_root_in_ram: 'A pasta de jogos está em um disco de RAM. Os jogos baixados serão perdidos ao reiniciar.'
    data_dir_in_ram: 'A pasta de dados está em um disco de RAM. O histórico, o cache e as configurações serão perdidos ao reiniciar.'
  messages:
    error: 'erro'
    yes: 'Sim'
    no: 'Não'
    ok: 'OK'
    cancel: 'Cancelar'
    done: 'Concluído'
    loading: 'Carregando...'
    confirm: 'Tem certeza? (s/N)'
    goodbye: 'Até logo!'
  status:
    idle: 'Ocioso'
    queued: 'Na fila'
    downloading: 'Baixando'
    verifying: 'Verificando'
    done: 'Concluído'
    skipped: 'Ignorado'
    failed: 'Falhou'
    canceled: 'Cancelado'
  consent:
    row: 'Precisa da sua confirmação: o arquivo tem {size}; o catálogo indicava {estimate}.'
    row_unknown: 'Precisa da sua confirmação: o arquivo tem {size}.'
    action: 'Baixar mesmo assim'
    title: 'Este arquivo tem {size}, não {estimate}.'
    title_unknown: 'Este arquivo tem {size}.'
    detail: 'O catálogo indicava um tamanho menor. Ele será salvo em {dir}.'
    detail_unknown: 'O catálogo não tinha o tamanho dele. Ele será salvo em {dir}.'
    keep: 'Não baixar'
    go: 'Baixar {size}'
    tui_ask: 'Baixar {name} mesmo assim? Tem {size}, não {estimate}, e vai para {dir}. [s/N]'
    tui_ask_unknown: 'Baixar {name} mesmo assim? Tem {size} e vai para {dir}. [s/N]'
    footer: 'r baixar mesmo assim'
    shell_ask: '{name} tem {size}, não {estimate}. Baixar mesmo assim em {dir}? [s/N]'
    shell_ask_unknown: '{name} tem {size}. Baixar mesmo assim em {dir}? [s/N]'
  units:
    b: 'B'
    kb: 'KB'
    mb: 'MB'
    gb: 'GB'
    tb: 'TB'
  labels:
    title: 'Título'
    platform: 'Plataforma'
    region: 'Região'
    size: 'Tamanho'
    links: 'Links'
  search:
    searching: 'Buscando...'
    no_results: 'Nenhum resultado encontrado'
    found:
      one: '{count} resultado encontrado'
      other: '{count} resultados encontrados'
  download:
    starting: 'Iniciando o download...'
    completed: 'Download concluído'
    summary: '{done} baixados, {skipped} ignorados, {failed} com falha em {elapsed}'
    summary_waiting: '{done} baixados, {skipped} ignorados, {failed} com falha em {elapsed}; {waiting} aguardando sua confirmação'
    speed: 'Velocidade: {speed}'
    eta: 'Restante: {eta}'
    files:
      one: '{count} arquivo'
      other: '{count} arquivos'
  cli:
    help:
      upgrade:
        short: 'Atualiza uma instalação gerenciada'
        long: 'Verifica e atualiza todos os componentes instalados do Mothdex. A verificação ocorre antes da confirmação. Use --version para escolher uma versão exata, inclusive para voltar uma versão.'
        example: |
          mdex upgrade
          mdex upgrade --check
          mdex upgrade --channel beta
          mdex upgrade --version 0.2.0 -f
        flags:
          check: 'verifica se há versão nova sem baixar os arquivos'
          version: 'instala esta versão exata (permite voltar uma versão)'
          channel: 'canal de versões: stable | beta'
      logs:
        example: 'mothdex logs list'
        long: 'Cada execução grava o próprio log. Estes comandos encontram os logs e geram o zip para anexar a um relato de erro. Rode mothdex help logs para ver o passo a passo.'
        short: 'Encontre e envie logs'
      logs_path:
        example: 'mothdex logs path'
        long: 'Mostra a pasta de logs e o caminho do latest.log.'
        short: 'Mostra onde ficam os logs'
      logs_last:
        flags:
          tail: 'só as últimas linhas (0 = todas)'
        example: 'mothdex logs last --tail 20'
        long: 'Mostra o log da sessão anterior a esta.'
        short: 'Mostra o log da sessão anterior'
      logs_list:
        example: 'mothdex logs list'
        long: 'Lista as sessões com data, programa, modo, duração e número de erros.'
        short: 'Lista as sessões'
      logs_show:
        flags:
          ref: 'mostra o erro com este ref'
        example: 'mothdex logs show --ref 7F3K2Q'
        long: 'Mostra uma sessão pelo id ou, com --ref, as linhas em volta do erro com esse ref, em qualquer sessão.'
        short: 'Mostra uma sessão ou um erro'
      logs_open:
        example: 'mothdex logs open'
        long: 'Abre a pasta de logs no gerenciador de arquivos.'
        short: 'Abre a pasta de logs'
      logs_bundle:
        flags:
          sessions: 'sessões mais recentes a incluir (1..20)'
          output: 'pasta existente para o zip (padrão: a pasta de logs)'
        example: 'mothdex logs bundle'
        long: 'Gera um zip com as sessões mais recentes, os arquivos de crash e o final do log geral, sem tokens, sem o endereço da API e sem a sua pasta de usuário. -o escolhe a pasta.'
        short: 'Gera um zip para anexar numa issue'
      logs_clear:
        example: 'mothdex logs clear -f'
        long: 'Apaga sessões, arquivos de crash e pacotes após confirmação (-f pula). O log geral permanece.'
        short: 'Apaga sessões, crashes e pacotes'
      boxart:
        flags:
          output: 'pasta de destino'
          slug: 'interprete o argumento como um slug'
        example: |-
          mothdex search mario
          mothdex boxart 1 -o ./games
        long: 'Salve a capa de um item na pasta de destino sem baixar o jogo.'
        short: 'Salve a capa de um item'
      cache:
        example: 'mothdex cache stats'
        long: 'Consulte o uso do cache local ou limpe dados do catálogo em cache. A sessão e o estado são preservados por padrão.'
        short: 'Consulte ou limpe o cache'
      cache_clear:
        example: 'mothdex cache clear'
        long: 'Limpe os namespaces selecionados ou, sem argumentos, os dados em cache exceto sessão e estado.'
        short: 'Limpe dados em cache (preserva sessão e estado por padrão)'
      cache_stats:
        example: 'mothdex cache stats'
        long: 'Mostre a quantidade de itens, tamanho e expiração por namespace do cache.'
        short: 'Mostre o uso do cache'
      completion:
        example: 'mothdex completion bash'
        long: 'Gere um script de autocompletar para mothdex e mdex. Carregue com source (bash/zsh), envie para source (fish) ou Invoke-Expression (PowerShell).'
        short: 'Gere autocompletar para mothdex e mdex'
      completion_bash:
        example: 'mothdex completion bash'
        long: 'Gere autocompletar de bash para mothdex e mdex. Carregue o script no arquivo de inicialização do seu shell.'
        short: 'Gere autocompletar para bash'
      completion_fish:
        example: 'mothdex completion fish'
        long: 'Gere autocompletar de fish para mothdex e mdex. Carregue o script no arquivo de inicialização do seu shell.'
        short: 'Gere autocompletar para fish'
      completion_powershell:
        example: 'mothdex completion powershell'
        long: 'Gere autocompletar de powershell para mothdex e mdex. Carregue o script no arquivo de inicialização do seu shell.'
        short: 'Gere autocompletar para powershell'
      completion_zsh:
        example: 'mothdex completion zsh'
        long: 'Gere autocompletar de zsh para mothdex e mdex. Carregue o script no arquivo de inicialização do seu shell.'
        short: 'Gere autocompletar para zsh'
      config:
        example: 'mothdex config list'
        long: 'Consulte as configurações efetivas e suas origens ou edite o arquivo YAML. Execute mothdex help config para consultar valores aceitos, padrões e variáveis de ambiente.'
        short: 'Consulte ou altere configurações'
      config_get:
        example: 'mothdex config get interface.language'
        long: 'Mostre o valor efetivo de uma chave de configuração com pontos.'
        short: 'Mostre uma configuração'
      config_list:
        example: 'mothdex config list'
        long: 'Liste os valores efetivos e suas origens: padrão, arquivo, ambiente ou flag do comando.'
        short: 'Liste todas as configurações'
      config_reset:
        example: 'mothdex config reset interface.page_size'
        long: 'Remova uma configuração para que uma chave, seção ou o arquivo inteiro volte aos padrões.'
        short: 'Remova uma configuração do arquivo'
      config_set:
        example: 'mothdex config set interface.page_size 10'
        long: 'Valide e salve um valor de configuração. A próxima execução lê o novo valor.'
        short: 'Altere uma configuração no arquivo'
      db_info:
        example: 'mothdex db-info'
        long: 'Mostre os totais do catálogo e os metadados do banco fornecidos pelo servidor.'
        short: 'Mostre estatísticas do catálogo'
      download:
        flags:
          allow_executable: 'permita tipos de arquivo que podem executar código'
          boxart: 'salve também a capa'
          jobs: 'downloads simultâneos'
          link: 'número do link a usar (tem prioridade sobre --prefer)'
          no_boxart: 'não salve a capa'
          output: 'pasta de destino (vira a raiz; arquivos vão diretamente para ela)'
          prefer: 'ordene links: chave=valor[,valor...] (pode repetir)'
          search: 'pesquise e baixe o primeiro resultado'
          slug: 'interprete os argumentos como slugs'
        example: |-
          mothdex search mario
          mothdex download 1
          mothdex download 1 -o ./games
          mothdex download --search mario
          mothdex download 1 --link 1
          mothdex download 1 --boxart
        long: 'Baixe pelo número do resultado ou slug. Ao usar números, execute search primeiro. --search escolhe o primeiro resultado. --link escolhe um link numerado; -o define a pasta de destino e --boxart salva a capa.'
        short: 'Baixe itens'
      gui:
        example: |-
          mothdex gui
          mothdex gui --lang pt_br
        long: 'Execute mothdex-gui da pasta de instalação da CLI. Repasse --config, --profile e --lang ao GUI. Se estiver ausente, reinstale sem -NoGui / --no-gui ou use mothdex tui.'
        short: 'Abra a interface com gamepad'
      help:
        example: |-
          mothdex help download
          mothdex help exit-codes
          mothdex help config
          mothdex help errors
        long: 'Mostre a ajuda de um comando ou tópico de referência: exit-codes, config ou errors.'
        short: 'Ajuda dos comandos e tópicos de referência'
      history:
        flags:
          export: 'grave os registros em um arquivo ou pasta'
          failed: 'somente downloads com falha'
          format: 'formato de exportação: txt | json | csv'
          limit: 'registros mais recentes a mostrar (0 = todos)'
        example: |-
          mothdex history
          mothdex history --failed
        long: 'Liste downloads anteriores, incluindo falhas. Exporte registros com --export e --format.'
        short: 'Mostre downloads anteriores'
      info:
        flags:
          prefer: 'ordene links: chave=valor[,valor...] (pode repetir)'
          slug: 'interprete o argumento como um slug'
        example: |-
          mothdex search mario
          mothdex info 1
        long: 'Mostre um item e seus links de download. Use um número da última busca ou um slug explícito com --slug.'
        short: 'Mostre um item e seus links'
      platforms:
        flags:
          brand: 'somente esta marca'
          class: 'somente esta classe'
        example: 'mothdex platforms'
        long: 'Liste os identificadores de plataforma aceitos por --platform.'
        short: 'Liste as plataformas'
      profile:
        example: 'mothdex profile show'
        long: 'Consulte o perfil ativo do frontend e as pastas de jogos detectadas.'
        short: 'Mostre ou detecte o perfil do frontend'
      profile_detect:
        example: 'mothdex profile detect'
        long: 'Detecte novamente o perfil do frontend e mostre as pastas e os avisos resultantes.'
        short: 'Detecte novamente o perfil'
      profile_show:
        example: 'mothdex profile show'
        long: 'Mostre o frontend ativo, a pasta de jogos, a origem da detecção e os avisos de armazenamento.'
        short: 'Mostre o perfil ativo'
      random:
        flags:
          count: 'quantidade de itens (1..20)'
          platform: 'identificador de plataforma (pode repetir)'
          region: 'identificador de região (pode repetir)'
          serial: 'serial exato'
        example: 'mothdex random'
        long: 'Escolha itens aleatórios do catálogo, com filtros opcionais de plataforma e região.'
        short: 'Mostre itens aleatórios'
      regions:
        example: 'mothdex regions'
        long: 'Liste os identificadores de região aceitos por --region.'
        short: 'Liste as regiões'
      root:
        example: |-
          mothdex search mario
          mothdex help config
        long: |-
          Pesquise no catálogo, consulte itens e baixe jogos. Use --json em scripts.
          Consulte mothdex help config, mothdex help exit-codes ou mothdex help errors para referência.
        short: 'Pesquise e baixe do catálogo Mothdex'
      search:
        flags:
          export: 'grave os resultados em um arquivo ou pasta'
          format: 'formato de exportação: txt | json | csv'
          page: 'número da página'
          page_size: 'resultados por página (1..100; padrão interface.page_size)'
          platform: 'identificador de plataforma (pode repetir)'
          region: 'identificador de região (pode repetir)'
          serial: 'serial exato'
          sort: 'relevance | title | size (somente a página atual)'
        example: |-
          mothdex search mario
          mothdex search mario --platform snes --page-size 10
        long: 'Pesquise títulos e salve uma página numerada para info e download. Filtre por plataforma ou região; a ordenação vale para a página atual.'
        short: 'Pesquise no catálogo'
      shell:
        example: 'mothdex shell'
        long: 'Abra uma sessão interativa com histórico e autocompletar por Tab. Comandos exclusivos do shell: n, p, page, sort, last, clear, exit e quit.'
        short: 'Abra o shell interativo'
      tui:
        example: 'mothdex tui'
        long: 'Abra a interface de tela cheia no terminal. Tanto a entrada quanto a saída precisam ser terminais interativos.'
        short: 'Abra a interface de tela cheia no terminal'
      version:
        example: 'mothdex version'
        long: 'Mostre a versão, o commit e a data do build. --json retorna o envelope padrão de saída.'
        short: 'Mostre a versão'
    flags:
      config: 'arquivo de configuração'
      force: 'pule confirmações; permita sobrescrever arquivos'
      help: 'mostre a ajuda deste comando'
      json: 'imprima um documento JSON na saída padrão'
      lang: 'idioma da interface, por exemplo pt_br'
      no_color: 'desative as cores'
      profile: 'identificador do perfil do frontend'
      quiet: 'imprima somente o resultado e erros'
      refresh: 'ignore leituras do cache, mas continue gravando'
      verbose: 'mostre a causa dos erros'
      version: 'mostre a versão e saia'
    template:
      command_or_topic: 'comando ou tópico'
      text_token: 'texto'
      key_token: 'chave'
      value_token: 'valor'
      default: 'padrão'
      exit_codes: |-
        Saída Significado                     error.code
        0     Sucesso (inclui ignorados)       —
        1     Erro interno inesperado         internal
        2     Uso ou configuração             usage, invalid_config, invalid_request, confirmation_required, unmapped_platform
        3     Não encontrado                  not_found, no_session, index_out_of_range
        4     Rede/serviço indisponível        network, rate_limited, upstream, api_incompatible, untrusted_url, untrusted_redirect
        5     Integridade                     size_mismatch, integrity
        6     Sistema de arquivos local       permission_denied, disk_full, exists, path_rejected, unsafe_name
        7     Lote parcial                    Primeira falha; todas em data.jobs[].error
        9     Atualização não aplicada        update_unavailable, update_failed
        130   Interrompido (prevalece sobre 7) canceled
      config_intro: |-
        Configuração: padrões < arquivo YAML < ambiente MOTHDEX_* < flags do comando.
        Use mothdex config set <chave> <valor> para salvar uma configuração.
      config_columns: 'Chave | Valores aceitos | Padrão | Ambiente'
      config_footer: |-
        As verificações de atualização não enviam versão nem identificador. Desligue com update.check=false ou MOTHDEX_NO_UPDATE_CHECK=1.
        profile.folders.<plataforma> | nome relativo da pasta | padrão do perfil | —
        Caminhos vazios usam pastas específicas do sistema. interface.language aceita auto ou um idioma como en_us/pt_br.
      error_reference: 'Referência de erros'
      error_columns: '| Código | Significado | Como corrigir |'
      no_error_action: 'Nenhuma ação necessária; execute o comando novamente para tentar outra vez.'
      usage: 'Uso'
      commands: 'Comandos disponíveis'
      examples: 'Exemplos'
      flags: 'Flags'
      global_flags: 'Flags globais'
      modes: 'Modos de uso'
      shell_commands: 'Comandos do shell: n, p, page <n>, sort <key>, last, clear, exit, quit'
      catalog: 'Catálogo'
      downloads: 'Downloads'
      interfaces: 'Interfaces'
      system: 'Sistema'
      command_token: 'comando'
      flags_token: 'opções'
      modes_table: |-
        Modo    Como abrir                   Para quê
        CLI     mdex <comando>               Scripts e uso rápido; aceita --json
        Shell   mdex, ou mdex shell          Comandos em sequência, n/p, histórico, Tab
        TUI     mdex tui                     Tela cheia, navegação por teclado
