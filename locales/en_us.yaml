# en_us: source of truth; every other locale falls back to it key by key.
locale:
  name: 'English'
  iso_code: 'en-US'
errors:
  update_unavailable:
    message: 'This installation cannot be updated by mothdex.'
    hint: 'Install using the one-line command for your OS: {install_command}'
  update_failed:
    message: 'The update could not be completed.'
    hint: 'If the previous version was restored, try mothdex upgrade again later; otherwise reinstall: {install_command}'
  usage:
    message: 'Invalid usage: {detail}'
    hint: 'Run "mothdex {command} --help".'
  invalid_config:
    message: 'Invalid setting {key}={value} (from {source}).'
    hint: 'Run "mothdex config reset {key}".'
  invalid_request:
    message: 'Invalid request: {detail}.'
    hint: 'Check the slug, filters and values you passed.'
  confirmation_required:
    message: 'This command needs confirmation.'
    hint: 'Add --force to skip the prompt.'
    size_hint: 'The file is {size}; the catalog said {estimate}. It needs your OK to download.'
    size_hint_cli: 'The file is {size}; the catalog said {estimate}. Add -f to download it anyway.'
  unmapped_platform:
    message: 'No folder is set for platform {platform}.'
    hint: 'Pass -o <dir>, or set profile.folders.{platform} in the configuration.'
  no_session:
    message: 'There is no previous search to refer to.'
    hint: 'Run "mothdex search <text>" first, or use --slug.'
  index_out_of_range:
    message: 'Result #{index} does not exist (last search has {count}).'
    hint: 'Pick a number between 1 and {count}.'
  not_found:
    message: 'No entry found for {ref}.'
    hint: 'Check the spelling or search with fewer words.'
  network:
    message: 'Cannot reach the Mothdex server.'
    hint: 'Check your connection.'
  rate_limited:
    message: 'The server asked us to slow down.'
    hint: 'Wait {retry_after} and try again.'
  upstream:
    message: 'The server had a problem (HTTP {status}).'
    hint: 'Try again in a few minutes.'
  api_incompatible:
    message: 'The server answered in a format this version does not understand.'
    hint: 'Update mothdex.'
  untrusted_url:
    message: 'Refusing to download from {host}.'
    hint: 'Only {allowed} is trusted.'
  untrusted_redirect:
    message: 'The server redirected to {host}, which is not trusted.'
    hint: 'Nothing was sent there. Try again later; if it persists, report it.'
  size_mismatch:
    message: 'The downloaded file has the wrong size ({got} of {expected}).'
    hint: 'Try again, or choose another link with --link.'
  integrity:
    message: 'The downloaded file is corrupt (archive check failed).'
    hint: 'Try again, or choose another link with --link.'
  permission_denied:
    message: 'Cannot write to {path}.'
    hint: 'Pick another folder with -o, or fix its permissions.'
  disk_full:
    message: 'Not enough free space in {path} (needs {needed}).'
    hint: 'Free some space or choose another folder with -o.'
  exists:
    message: '{path} already exists.'
    hint: 'Set download.on_exists to rename or overwrite.'
  path_rejected:
    message: 'Refusing to write to {path}.'
    hint: 'Nothing was written. Choose another folder with -o, or check profile.folders.'
    missing_hint: '{path} does not exist. Create it, pass -o <folder>, or run: mothdex config set download.dir <folder>'
  unsafe_name:
    message: 'Refusing to save {name}: its file type can run code.'
    hint: 'Nothing was written. Choose another link with --link, or pass --allow-executable if you trust it.'
  canceled:
    message: 'Canceled.'
    hint: ''
  internal:
    message: 'Unexpected error.'
    hint: 'Details are in {log_path}. Please report it.'
ui:
  storage:
    rom_root_in_ram: 'Games folder is on a RAM disk: downloaded games are lost at reboot.'
    data_dir_in_ram: 'Data folder is on a RAM disk: history, cache and settings are lost at reboot.'
  messages:
    error: 'error'
    yes: 'Yes'
    no: 'No'
    ok: 'OK'
    cancel: 'Cancel'
    done: 'Done'
    loading: 'Loading...'
    confirm: 'Are you sure? (y/N)'
    goodbye: 'Goodbye!'
  status:
    idle: 'Idle'
    queued: 'Queued'
    downloading: 'Downloading'
    verifying: 'Verifying'
    done: 'Done'
    skipped: 'Skipped'
    failed: 'Failed'
    canceled: 'Canceled'
  consent:
    # A download whose real size needs a person's OK (error code confirmation_required): "Download anyway".
    row: 'Needs your OK: the file is {size}, listed as {estimate}.'
    row_unknown: 'Needs your OK: the file is {size}.'
    action: 'Download anyway'
    title: 'This file is {size}, not {estimate}.'
    title_unknown: 'This file is {size}.'
    detail: 'The catalog listed a smaller size. It will be saved to {dir}.'
    detail_unknown: 'The catalog had no size for it. It will be saved to {dir}.'
    keep: "Don't download"
    go: 'Download {size}'
    tui_ask: 'Download {name} anyway? It is {size}, not {estimate}, saved to {dir}. [y/N]'
    tui_ask_unknown: 'Download {name} anyway? It is {size}, saved to {dir}. [y/N]'
    footer: 'r download anyway'
    shell_ask: '{name} is {size}, not {estimate}. Download it anyway to {dir}? [y/N]'
    shell_ask_unknown: '{name} is {size}. Download it anyway to {dir}? [y/N]'
  units:
    b: 'B'
    kb: 'KB'
    mb: 'MB'
    gb: 'GB'
    tb: 'TB'
  labels:
    title: 'Title'
    platform: 'Platform'
    region: 'Region'
    size: 'Size'
    links: 'Links'
  search:
    searching: 'Searching...'
    no_results: 'No results found'
    found:
      one: 'Found {count} result'
      other: 'Found {count} results'
  download:
    starting: 'Starting download...'
    completed: 'Download completed'
    summary: '{done} downloaded, {skipped} skipped, {failed} failed in {elapsed}'
    summary_waiting: '{done} downloaded, {skipped} skipped, {failed} failed in {elapsed}; {waiting} waiting for your OK'
    speed: 'Speed: {speed}'
    eta: 'ETA: {eta}'
    files:
      one: '{count} file'
      other: '{count} files'
  cli:
    help:
      boxart:
        example: |-
          mothdex search mario
          mothdex boxart 1 -o ./games
        long: 'Save an entry cover to the destination folder without downloading the game.'
        short: 'Save the cover of an entry'
      cache:
        example: 'mothdex cache stats'
        long: 'Inspect local cache usage or clear cached catalog data. Session and state are preserved by default.'
        short: 'Inspect or clear the cache'
      cache_clear:
        example: 'mothdex cache clear'
        long: 'Clear selected namespaces, or cached data other than session and state when none are given.'
        short: 'Clear cached data (default: everything except the session and state)'
      cache_stats:
        example: 'mothdex cache stats'
        long: 'Show item counts, sizes and expiry by cache namespace.'
        short: 'Show cache usage'
      completion:
        example: 'mothdex completion bash'
        long: 'Generate a shell completion script for mothdex and mdex. Load it with source (bash/zsh), pipe to source (fish), or Invoke-Expression (PowerShell).'
        short: 'Generate shell completion for mothdex and mdex'
      completion_bash:
        example: 'mothdex completion bash'
        long: 'Generate bash completion for mothdex and mdex. Load the script in your shell startup file.'
        short: 'Generate bash completion'
      completion_fish:
        example: 'mothdex completion fish'
        long: 'Generate fish completion for mothdex and mdex. Load the script in your shell startup file.'
        short: 'Generate fish completion'
      completion_powershell:
        example: 'mothdex completion powershell'
        long: 'Generate powershell completion for mothdex and mdex. Load the script in your shell startup file.'
        short: 'Generate powershell completion'
      completion_zsh:
        example: 'mothdex completion zsh'
        long: 'Generate zsh completion for mothdex and mdex. Load the script in your shell startup file.'
        short: 'Generate zsh completion'
      config:
        example: 'mothdex config list'
        long: 'Read effective settings and their sources, or edit the YAML configuration. Run mothdex help config for accepted values, defaults and environment overrides.'
        short: 'Read or change settings'
      config_get:
        example: 'mothdex config get interface.language'
        long: 'Print the effective value of one dotted configuration key.'
        short: 'Show one setting'
      config_list:
        example: 'mothdex config list'
        long: 'List effective values and their sources: default, file, environment or command flag.'
        short: 'List every setting'
      config_reset:
        example: 'mothdex config reset interface.page_size'
        long: 'Remove an override so a key, section or the whole file returns to defaults.'
        short: 'Remove a setting from the configuration file'
      config_set:
        example: 'mothdex config set interface.page_size 10'
        long: 'Validate and save a configuration value. The next invocation reads the new value.'
        short: 'Change a setting in the configuration file'
      db_info:
        example: 'mothdex db-info'
        long: 'Show catalog totals and database metadata from the server.'
        short: 'Show catalog statistics'
      download:
        example: |-
          mothdex search mario
          mothdex download 1
          mothdex download 1 -o ./games
          mothdex download --search mario
          mothdex download 1 --link 1
          mothdex download 1 --boxart
        long: 'Download by result number or slug. Run search first when using numbers. --search selects the first match. --link selects a numbered link; -o chooses a destination folder and --boxart saves its cover.'
        short: 'Download entries'
      gui:
        example: |-
          mothdex gui
          mothdex gui --lang pt_br
        long: 'Run mothdex-gui from the CLI installation folder. Forward --config, --profile and --lang to the GUI. Reinstall without -NoGui / --no-gui if it is missing, or use mothdex tui.'
        short: 'Open the gamepad interface'
      help:
        example: |-
          mothdex help download
          mothdex help exit-codes
          mothdex help config
          mothdex help errors
        long: 'Show help for a command or a reference topic: exit-codes, config or errors.'
        short: 'Help for commands and reference topics'
      history:
        example: |-
          mothdex history
          mothdex history --failed
        long: 'List previous downloads, including failures. Export records using --export and --format.'
        short: 'Show past downloads'
      info:
        example: |-
          mothdex search mario
          mothdex info 1
        long: 'Show an entry and its download links. Use a number from the last search or an explicit slug with --slug.'
        short: 'Show one entry and its links'
      platforms:
        example: 'mothdex platforms'
        long: 'List platform identifiers accepted by --platform.'
        short: 'List platforms'
      profile:
        example: 'mothdex profile show'
        long: 'Inspect the active frontend profile and detected game folders.'
        short: 'Show or detect the frontend profile'
      profile_detect:
        example: 'mothdex profile detect'
        long: 'Detect the frontend profile again and show the resulting folders and warnings.'
        short: 'Detect the profile again'
      profile_show:
        example: 'mothdex profile show'
        long: 'Show the active frontend, game root, detection source and storage warnings.'
        short: 'Show the active profile'
      random:
        example: 'mothdex random'
        long: 'Pick random catalog entries, optionally filtered by platform and region.'
        short: 'Show random entries'
      regions:
        example: 'mothdex regions'
        long: 'List region identifiers accepted by --region.'
        short: 'List regions'
      root:
        example: |-
          mothdex search mario
          mothdex help config
        long: |-
          Search the catalog, inspect entries and download games. Use --json for scripts.
          Run mothdex help config, mothdex help exit-codes or mothdex help errors for reference.
        short: 'Search and download from the Mothdex catalog'
      search:
        example: |-
          mothdex search mario
          mothdex search mario --platform snes --page-size 10
        long: 'Search titles and save a numbered result page for info and download. Filter by platform or region; sorting applies to the current page.'
        short: 'Search the catalog'
      shell:
        example: 'mothdex shell'
        long: 'Open an interactive session with history and Tab completion. Shell-only commands: n, p, page, sort, last, clear, exit and quit.'
        short: 'Start the interactive shell'
      tui:
        example: 'mothdex tui'
        long: 'Open the full-screen terminal interface. Both input and output must be interactive terminals.'
        short: 'Start the full-screen terminal UI'
      version:
        example: 'mothdex version'
        long: 'Print version, commit and build date. --json returns the standard output envelope.'
        short: 'Print the version'
    flags:
      allow_executable: 'allow file types that can run code'
      boxart: 'also save the cover'
      brand: 'only this brand'
      class: 'only this class'
      config: 'configuration file'
      count: 'how many entries (1..20)'
