      jobs: 'downloads at the same time'
      json: 'print one JSON document on stdout'
      lang: 'interface language, for example pt_br'
      limit: 'newest records to show (0 = all)'
      link: 'link number to use (wins over --prefer)'
      no_boxart: 'do not save the cover'
      no_color: 'turn colors off'
      output: 'destination folder (becomes the root; files go straight into it)'
      page: 'page number'
      page_size: 'results per page (1..100; default interface.page_size)'
      platform: 'platform id (repeatable)'
      prefer: 'rank links: key=value[,value...] (repeatable)'
      profile: 'frontend profile id'
      quiet: 'print only the result and errors'
      refresh: 'skip cache reads, still write'
      region: 'region id (repeatable)'
      search: 'search and download the first result'
      serial: 'exact serial'
      slug: 'read the argument as a slug'
      sort: 'relevance | title | size (current page only)'
      verbose: 'show the cause of errors'
      version: 'print the version and exit'
    template:
      default: 'default'
      exit_codes: |-
        Exit  Meaning                         error.code
        0     Success (including skipped)     —
        1     Unexpected internal error       internal
        2     Usage or configuration          usage, invalid_config, invalid_request, confirmation_required, unmapped_platform
        3     Not found                       not_found, no_session, index_out_of_range
        4     Network/service unavailable     network, rate_limited, upstream, api_incompatible, untrusted_url, untrusted_redirect
        5     Integrity                       size_mismatch, integrity
        6     Local filesystem                permission_denied, disk_full, exists, path_rejected, unsafe_name
        7     Partial batch                   First failure; all failures in data.jobs[].error
        9     Self-update not applied         update_unavailable, update_failed
        130   Interrupted (wins over 7)        canceled
      config_intro: |-
        Configuration: defaults < YAML file < MOTHDEX_* environment < command flags.
        Use mothdex config set <key> <value> to save an override.
      config_columns: 'Key | Accepted values | Default | Environment'
      config_footer: |-
        profile.folders.<platform> | relative folder name | profile default | —
        Empty paths use platform-specific directories. interface.language accepts auto or a locale such as en_us/pt_br.
      error_reference: 'Error reference'
      error_columns: '| Code | Meaning | How to fix |'
      no_error_action: 'No action required; run the command again to retry.'
      usage: 'Usage'
      commands: 'Available Commands'
      examples: 'Examples'
      flags: 'Flags'
      global_flags: 'Global Flags'
      modes: 'Modes'
      shell_commands: 'Shell commands: n, p, page <n>, sort <key>, last, clear, exit, quit'
      catalog: 'Catalog'
      downloads: 'Downloads'
      interfaces: 'Interfaces'
      system: 'System'
      command_token: 'command'
      flags_token: 'flags'
      modes_table: |-
        Mode    Open                         Purpose
        CLI     mdex <command>               Scripts and quick use; accepts --json
        Shell   mdex, or mdex shell          Sequential commands, n/p, history, Tab
        TUI     mdex tui                     Full-screen keyboard navigation
        GUI     mdex gui, or mothdex-gui     Gamepad interface for RetroBat, Batocera and similar systems
