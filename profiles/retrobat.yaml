# Source: docs/research/T1e-emulation-systems.md (checked 2026-11-20). Verified flags: true = confirmed in T1e,
# false (or omitted) = unverified or inferred, to be confirmed by the community beta.
# Only the 15 platform ids confirmed in T1e section 4 are mapped; every other id is deliberately unmapped (unmapped: error),
# so the user picks -o <dir> or profile.folders.<id> until its folder name is sourced.
schema: 1
id: retrobat
name: RetroBat
os: windows
priority: 80
detect:
  any:
    - verified: true
      files:
        - '${CONFIG:profile.retrobat_path}\RetroBat.exe'
        - '${CONFIG:profile.retrobat_path}\retrobat.ini'
    - { file: 'C:\RetroBat\RetroBat.exe', verified: false }
roms:
  root: '${MATCH}\roms'
  root_verified: true
  folders_verified: true
  layout: per_system
  unmapped: error
  folders:
    32x: sega32x
    dc: dreamcast
    gb: gb
    gba: gba
    gbc: gbc
    gg: gamegear
    md: megadrive
    n64: n64
    nes: nes
    ps1: psx
    sat: saturn
    scd: megacd
    sms: mastersystem
    snes: snes
    tg16: pcengine
bin_dir: { path: '${MATCH}\mothdex', verified: false }   # own choice
launcher: { kind: bat, dir: '${MATCH}\roms\windows', verified: true }
refresh: { kind: http_get, url: "http://127.0.0.1:1234/reloadgames", timeout: 3s, verified: true }
