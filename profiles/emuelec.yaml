# Source: docs/research/T1e-emulation-systems.md (checked 2026-11-20). Verified flags: true = confirmed in T1e,
# false (or omitted) = unverified or inferred, to be confirmed by the community beta.
# Only the 15 platform ids confirmed in T1e section 4 are mapped; every other id is deliberately unmapped (unmapped: error),
# so the user picks -o <dir> or profile.folders.<id> until its folder name is sourced.
schema: 1
id: emuelec
name: EmuELEC
os: linux
priority: 90
detect:
  all:
    - { os_release: { ID: emuelec }, verified: true }
roms:
  root: /storage/roms
  root_verified: true
  folders_verified: true
  layout: per_system
  unmapped: error
  folders:
    32x: sega32x
    dc: dreamcast
    gb: gb
    gba: gba
    gbc: gbc
    gg: gamegear
    md: megadrive
    n64: n64
    nes: nes
    ps1: psx
    sat: saturn
    scd: segacd
    sms: mastersystem
    snes: snes
    tg16: pcengine
bin_dir: { path: /storage/.local/bin, verified: false }
launcher: { kind: sh, dir: /storage/roms/ports_scripts, verified: true }
refresh: { kind: http_get, url: "http://127.0.0.1:1234/reloadgames", timeout: 3s, verified: true }
