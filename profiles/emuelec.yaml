# Source: docs/research/T15b-platform-folders.md (Sonda, checked 2026-11-20) for folders; T1e for paths and probes.
# Verified flags: true = confirmed in the cited source, false (or omitted) = unverified or inferred, to be confirmed by the
# community beta. Unmapped on purpose (unmapped: error, the user picks -o <dir> or profile.folders.<id>): arcade ids
# (profiles.md §5), ids with no system in this frontend, and pc (pending: its folder windows is a launcher folder).
schema: 1
id: emuelec
name: EmuELEC
os: linux
priority: 90
detect:
  all:
    - { os_release: { ID: emuelec }, verified: true }
roms:
  root: /storage/roms
  root_verified: true
  folders_verified: true
  layout: per_system
  unmapped: error
  folders:
    32x: sega32x
    3do: 3do
    3ds: 3ds
    a26: atari2600
    a52: atari5200
    a78: atari7800
    cdi: cdi
    cv: coleco
    dc: dreamcast
    dos: pc
    fds: fds
    fmt: fmtownsux
    gb: gb
    gba: gba
    gbc: gbc
    gc: gamecube
    gg: gamegear
    intv: intellivision
    jag: atarijaguar
    jcd: atarijaguarcd
    lynx: atarilynx
    mac: macintosh
    md: megadrive
    n3ds: 3ds
    n64: n64
    nds: nds
    nes: nes
    ngcd: neocd
    pc98: pc98
    pcfx: pcfx
    pmin: pokemini
    ps1: psx
    psp: psp
    sat: saturn
    scd: segacd
    sms: mastersystem
    snes: snes
    tg16: pcengine
    tgcd: pcenginecd
    vb: virtualboy
    wii: wii
bin_dir: { path: /storage/.local/bin, verified: false }
launcher: { kind: sh, dir: /storage/roms/ports_scripts, verified: true }
refresh: { kind: http_get, url: "http://127.0.0.1:1234/reloadgames", timeout: 3s, verified: true }
