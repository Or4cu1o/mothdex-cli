# Source: docs/research/T15b-platform-folders.md (Sonda, checked 2026-11-20) for folders; T1e for paths and probes.
# Verified flags: true = confirmed in the cited source, false (or omitted) = unverified or inferred, to be confirmed by the
# community beta. Unmapped on purpose (unmapped: error, the user picks -o <dir> or profile.folders.<id>): arcade ids
# (profiles.md §5), ids with no system in this frontend, and pc (D19: its folder windows is a launcher folder).
schema: 1
id: recalbox
name: Recalbox
os: linux
priority: 80
detect:
  all:
    - { dir: /recalbox/share/roms, verified: false }
  any:
    - { file: /recalbox/recalbox.version, verified: false }
roms:
  root: /recalbox/share/roms
  root_verified: true
  folders_verified: false   # 51 of 146 system.ini read, rest inferred (T15b)
  layout: per_system
  unmapped: error
  folders:
    32x: sega32x
    3do: 3do
    64dd: 64dd
    a26: atari2600
    a52: atari5200
    a78: atari7800
    cdi: cdi
    cv: colecovision
    dc: dreamcast
    dos: dos
    fds: fds
    gb: gb
    gba: gba
    gbc: gbc
    gc: gamecube
    gg: gamegear
    intv: intellivision
    jag: jaguar
    lynx: lynx
    mac: macintosh
    md: megadrive
    n64: n64
    nds: nds
    nes: nes
    ngcd: neogeocd
    pc98: pc98
    pcfx: pcfx
    pmin: pokemini
    ps1: psx
    ps2: ps2
    psp: psp
    sat: saturn
    scd: segacd
    sms: mastersystem
    snes: snes
    tg16: pcengine
    tgcd: pcenginecd
    vb: virtualboy
    wii: wii
    xbox: xbox
bin_dir: { path: /recalbox/share/system/bin, verified: false }
launcher: { kind: none, verified: true }   # no ports system in Recalbox 10.1.2
refresh: { kind: manual, verified: false } # no reload API found
