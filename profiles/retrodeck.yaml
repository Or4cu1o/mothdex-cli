# Source: docs/research/T15b-platform-folders.md (Sonda, checked 2026-11-20) for folders; T1e for paths and probes.
# Verified flags: true = confirmed in the cited source, false (or omitted) = unverified or inferred, to be confirmed by the
# community beta. Unmapped on purpose (unmapped: error, the user picks -o <dir> or profile.folders.<id>): arcade ids
# (profiles.md §5), ids with no system in this frontend, and pc (D19: its folder windows is a launcher folder).
schema: 1
id: retrodeck
name: RetroDECK
os: linux
priority: 50
detect:
  all:
    - { dir: '${HOME}/retrodeck/roms', verified: true }   # a custom path inside the Flatpak config: set profile.rom_root
roms:
  root: '${MATCH}'
  root_verified: true
  folders_verified: false   # ES-DE names; RetroDECK's ROM layout not checked in its repo (T15b)
  layout: per_system
  unmapped: error
  folders:
    32x: sega32x
    3do: 3do
    3ds: n3ds
    64dd: n64dd
    a26: atari2600
    a52: atari5200
    a78: atari7800
    cdi: cdimono1
    cv: colecovision
    dc: dreamcast
    dos: dos
    fds: fds
    fmt: fmtowns
    gb: gb
    gba: gba
    gbc: gbc
    gc: gc
    gg: gamegear
    intv: intellivision
    jag: atarijaguar
    jcd: atarijaguarcd
    lynx: atarilynx
    mac: macintosh
    md: megadrive
    n3ds: n3ds
    n64: n64
    nds: nds
    nes: nes
    ngcd: neogeocd
    pc98: pc98
    pcfx: pcfx
    pmin: pokemini
    ps1: psx
    ps2: ps2
    ps3: ps3
    psp: psp
    psv: psvita
    sat: saturn
    scd: segacd
    sms: mastersystem
    snes: snes
    tg16: pcengine
    tgcd: pcenginecd
    vb: virtualboy
    wii: wii
    wiiu: wiiu
    x360: xbox360
    xbox: xbox
bin_dir: { path: '${HOME}/.local/bin', verified: false }
launcher: { kind: none, verified: true }   # backlog
refresh: { kind: manual, verified: false }
