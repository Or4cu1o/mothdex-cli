# GoReleaser OSS configuration. Validated with `goreleaser check` and
# `goreleaser release --snapshot --clean --skip=sign` (see docs in CONTRIBUTING.md).
# Publishing is NOT done by GoReleaser: the release workflow uploads the
# artifacts with `gh` after signing and attestation. No package manager is
# published to (decision D3).
version: 2

project_name: mothdex

before:
  hooks:
    - go mod verify
    # The Windows GUI archive ships the pinned SDL2.dll (scripts/sdl2-windows.pin): exact URL, SHA-256 checked before
    # extraction, never cached. Linux archives never ship SDL2.
    - scripts/fetch-sdl2-windows.sh dist-sdl2

builds:
  - id: mothdex
    main: ./cmd/mothdex
    binary: mothdex
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64, arm, "386"]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: "386"
      - goos: windows
        goarch: arm

  # The GUI (docs/contracts/cli/gui.md section 6, ports.md): a second binary built with the gui tag, still CGO_ENABLED=0
  # (purego loads SDL2 at run time). On Linux it is dynamic, so the arm interpreter is set to the armhf glibc loader
  # (gui.md section 2). Two builds only so that the Windows archive can carry SDL2.dll and the Linux ones cannot.
  - id: mothdex-gui-linux
    main: ./cmd/mothdex-gui
    binary: mothdex-gui
    tags: [gui]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Version={{ .Version }}
        -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Commit={{ .FullCommit }}
        -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Date={{ .CommitDate }}
        {{ if eq .Arch "arm" }}-I /lib/ld-linux-armhf.so.3{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [linux_amd64, linux_arm64, linux_arm_6, linux_arm_7]
  - id: mothdex-gui-windows
    main: ./cmd/mothdex-gui
    binary: mothdex-gui
    tags: [gui]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Version={{ .Version }}
        -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Commit={{ .FullCommit }}
        -X github.com/Or4cu1o/mothdex-cli/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets: [windows_amd64]

archives:
  - id: mothdex
    ids: [mothdex]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    # Fixed mtimes keep the archives reproducible (binaries use mod_timestamp).
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"
      # the licence notices of the Go modules linked into this binary (scripts/gen-go-notices.sh)
      - src: THIRD_PARTY/go-modules-mothdex.txt
        dst: THIRD_PARTY
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"

  # GUI archives: mothdex-gui_<version>_<os>_<arch>, never inside the mothdex_ archives. The members are exactly what
  # install.sh and install.ps1 extract by name: the binary, LICENSE, README.md, CHANGELOG.md, the files of THIRD_PARTY/
  # (their fixed notice lists equal that folder, checked by tests/installer) and, on Windows only, SDL2.dll.
  - id: mothdex-gui-linux
    ids: [mothdex-gui-linux]
    formats: [tar.gz]
    name_template: >-
      mothdex-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY/*
        dst: THIRD_PARTY
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
  - id: mothdex-gui-windows
    ids: [mothdex-gui-windows]
    formats: [zip]
    name_template: >-
      mothdex-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY/*
        dst: THIRD_PARTY
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
      - src: dist-sdl2/SDL2.dll
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive-sboms
    artifacts: archive

# Keyless signature of checksums.txt through GitHub OIDC (workflow needs id-token: write).
signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

# The release workflow creates the GitHub release itself.
release:
  disable: true
