name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mothdex` (version line).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      description: For example Batocera 41 arm64, Windows 11 amd64, Debian 13 amd64.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove any personal paths or tokens before pasting.
      render: shell
