name: Release

# Runs only for version tags. Three jobs with separate permissions:
# build (OIDC for keyless signing, read-only repo) -> attest (OIDC +
# attestations) -> publish (the only job that can write contents).
# No dependency cache is used anywhere in this workflow.
# The owner-side settings this depends on (environment `release` with required
# reviewers, tag ruleset for v*) are documented in docs/release.md.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGNER_WORKFLOW: Or4cu1o/mothdex-cli/.github/workflows/release.yml

jobs:
  build:
    name: build and sign
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # cosign keyless signing (GitHub OIDC)
    steps:
      - name: Require a semantic version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag '$TAG' is not vX.Y.Z[-pre]"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-user file jq unzip
      - name: Install pinned release tools (goreleaser, cosign, syft)
        run: |
          for tool in goreleaser cosign syft; do
            GOBIN="$RUNNER_TEMP/bin" go -C "tools/$tool" install tool
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build, checksum, SBOM and sign
        run: goreleaser release --clean
      - name: Verify the signature and its signer identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -s dist/checksums.txt.sigstore.json
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${SIGNER_WORKFLOW}@refs/tags/${TAG}" \
            dist/checksums.txt
      - name: Verify the build output
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/verify-dist.sh dist "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Attest every file listed in checksums.txt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest checksums.txt itself
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/checksums.txt

  publish:
    name: publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      attestations: read # gh attestation verify
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Verify checksums before publishing
        working-directory: dist
        run: sha256sum --check --strict checksums.txt
      - name: Verify attestations (signer workflow, tag and commit) before publishing
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for f in checksums.txt $(awk '{print $2}' checksums.txt); do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" --source-ref "refs/tags/$TAG" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: The upload set is exactly what checksums.txt lists
        working-directory: dist
        run: |
          # sha256sum --check only covers the listed files: nothing else may be uploaded.
          want=$( { awk '{print $2}' checksums.txt; echo checksums.txt; echo checksums.txt.sigstore.json; } | sort )
          have=$(ls -1A | sort)
          [ "$want" = "$have" ] || { echo "the files in dist differ from checksums.txt plus checksums.txt and its bundle"; diff <(echo "$want") <(echo "$have") || true; exit 1; }
      - name: The tag still points at the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Last step before the release is created, to keep the window short. Resolve the tag through annotated
          # tag objects to a commit (one API call per object); it must be the commit this run built.
          out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          type=${out% *}; sha=${out#* }
          for _ in 1 2 3; do
            [ "$type" = "tag" ] || break
            out=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.type + " " + .object.sha')
            type=${out% *}; sha=${out#* }
          done
          [ "$type" = "commit" ] || { echo "tag $TAG does not resolve to a commit"; exit 1; }
          [ "$sha" = "$GITHUB_SHA" ] || { echo "tag $TAG moved: it is at $sha, this run built $GITHUB_SHA"; exit 1; }
      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $flags \
            ./*.tar.gz ./*.zip ./*.sbom.json checksums.txt checksums.txt.sigstore.json
