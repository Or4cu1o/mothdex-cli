name: GUI spike

# The SDL2 spike of docs/contracts/cli/gui.md section 2 ("What the spike must prove"), kept afterwards as the GUI
# smoke test. The arm64, armv7 and armv6 legs are in gui-spike-qemu.yml (they need an action the repository does not allow yet). Read-only token, actions pinned by SHA, no dependency cache. Nothing here publishes anything.
# It runs on every pull request, so its jobs can be required status checks. The probe jobs start with
# scripts/ci-scope.sh: when the pull request touches neither the GUI code, its scripts, go.mod and go.sum nor this
# file, every later step is skipped and the job succeeds. The static job is cheap and always runs, because the
# isolation check (mothdex free of purego) can break from a change outside the GUI paths.
#
# Decision rule (gui.md): a failure on a Tier 1 target (linux amd64, linux arm64, windows amd64) stops the spike and
# goes to Regente; a failure only on arm32 means v0.3.0 ships without the arm32 GUI. The armv6 leg is best effort
# and may fail (continue-on-error): it is not a stop.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: isolation and SDL2 constants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the SDL2 headers (libsdl2-dev)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: shellcheck the GUI scripts
        run: shellcheck -s sh scripts/gui-probe.sh scripts/check-gui-isolation.sh scripts/check-sdl-constants.sh scripts/ci-scope.sh
      - name: mothdex stays free of purego and the GUI packages
        run: scripts/check-gui-isolation.sh
      - name: The binding constants and struct layouts equal the SDL2 headers
        run: |
          dpkg -s libsdl2-dev | grep '^Version'
          scripts/check-sdl-constants.sh

  linux-amd64:
    name: probe (linux/amd64, distro SDL2, dummy driver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scope (does this pull request touch what this job checks?)
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci-scope.sh gui
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
        if: steps.scope.outputs.run == 'true'
      - name: Install the distro SDL2 and readelf
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 binutils
          dpkg -s libsdl2-2.0-0 | grep '^Version'
        if: steps.scope.outputs.run == 'true'
      - name: Build, readelf and run the probe
        env:
          SDL_VIDEODRIVER: dummy
        run: scripts/gui-probe.sh linux/amd64
        if: steps.scope.outputs.run == 'true'
      - name: go test -tags gui ./internal/ui/gui/sdl
        env:
          SDL_VIDEODRIVER: dummy
          GUI_REQUIRE_SDL: "1" # a broken libsdl2 install fails here instead of skipping the smoke test
        run: go test -tags gui -count=1 -v ./internal/ui/gui/sdl
        if: steps.scope.outputs.run == 'true'
      - name: --probe, the installer's eligibility check (scrubbed environment, with and without SDL2)
        run: |
          probe=dist-gui/linux_amd64/mothdex-gui-probe
          # Eligible: the installer runs it as `env -i PATH=... timeout 20 mothdex-gui --probe` (ports.md 5.2, T-70 IC-1,
          # IC-10). Exit 0 and exactly one line, "sdl X.Y.Z word", on stdout: the word says where SDL2 was loaded from (PRT-G9).
          # (An explicit --probe beats the probe name.)
          set +e
          out=$(env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin timeout 20 "$probe" --probe 2>probe.err)
          code=$?
          set -e
          echo "exit $code, stdout [$out], stderr [$(cat probe.err)]"
          [ "$code" -eq 0 ] || { echo "::error::--probe exited $code with SDL2 installed"; exit 1; }
          printf '%s\n' "$out" | grep -Eq '^sdl [0-9]+\.[0-9]+\.[0-9]+ (system|ld_library_path|other|unknown)$' || { echo "::error::stdout is not one line sdl X.Y.Z word"; exit 1; }
          [ ! -s probe.err ] || { echo "::error::an eligible probe wrote to stderr"; exit 1; }
          # Not eligible: a machine with no SDL2 (a Debian image without libsdl2). Exit 8, nothing on stdout, one clean
          # line of reason on stderr, at most 200 bytes.
          out=$(docker run --rm -v "$PWD/dist-gui/linux_amd64:/t:ro" debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            sh -c 'env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /t/mothdex-gui-probe --probe 2>/tmp/err; echo "code=$?"; cat /tmp/err')
          echo "$out"
          printf '%s\n' "$out" | grep -q '^code=8$' || { echo "::error::--probe without SDL2 did not exit 8"; exit 1; }
          reason=$(printf '%s\n' "$out" | sed -n '2,$p')
          [ "$(printf '%s\n' "$reason" | wc -l)" -eq 1 ] && [ "${#reason}" -gt 0 ] && [ "${#reason}" -le 200 ] || { echo "::error::the reason is not one line of at most 200 bytes"; exit 1; }
          case $reason in *[![:print:]]*) echo "::error::the reason has control characters"; exit 1 ;; esac
        if: steps.scope.outputs.run == 'true'
      - name: Library planting is ignored (a garbage libSDL2-2.0.so.0 in the cwd and next to the probe)
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          # The real distro SDL2 is installed. The probe loads it by soname, so a file of that name in the working
          # directory or in the probe's own directory must not be picked up (no RPATH, no LD_LIBRARY_PATH).
          plant=$(mktemp -d)
          mkdir "$plant/cwd" "$plant/exe"
          printf 'not an ELF file\n' > "$plant/cwd/libSDL2-2.0.so.0"
          printf 'not an ELF file\n' > "$plant/exe/libSDL2-2.0.so.0"
          cp dist-gui/linux_amd64/mothdex-gui-probe "$plant/exe/"
          out=$(cd "$plant/cwd" && "$plant/exe/mothdex-gui-probe")
          echo "$out"
          echo "$out" | grep -q 'probe ok'
        if: steps.scope.outputs.run == 'true'
      - name: Cross-build and readelf linux/386 (optional target, not run)
        continue-on-error: true
        env:
          GUI_PROBE_RUN: "0"
        run: scripts/gui-probe.sh linux/386
        if: steps.scope.outputs.run == 'true'
      - name: Size report
        run: |
          {
            echo "### GUI probe sizes (linux)"
            echo
            printf '%s\n' '```'
            find dist-gui -type f -name 'mothdex-gui-probe*' -exec ls -l {} +
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
        if: steps.scope.outputs.run == 'true'

  windows-amd64:
    name: probe (windows/amd64, pinned SDL2.dll)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scope (does this pull request touch what this job checks?)
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci-scope.sh gui
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
        if: steps.scope.outputs.run == 'true'
      - name: Fetch SDL2.dll by the pinned URL and verify its SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content scripts/sdl2-windows.pin | Where-Object { $_ -match '^(url|sha256)=' }) -join "`n" | ConvertFrom-StringData
          if ($pin.url -notmatch '^https://github\.com/libsdl-org/SDL/releases/download/release-[0-9.]+/SDL2-[0-9.]+-win32-x64\.zip$') { throw "unexpected SDL2 URL: $($pin.url)" }
          if ($pin.sha256 -notmatch '^[0-9a-f]{64}$') { throw 'the pinned SHA-256 is not 64 lower-case hex digits' }
          $zip = Join-Path $env:RUNNER_TEMP 'sdl2.zip'
          Invoke-WebRequest -Uri $pin.url -OutFile $zip -MaximumRedirection 5
          $got = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($got -ne $pin.sha256) { throw "SDL2 zip hash mismatch: got $got, pinned $($pin.sha256)" }
          $dest = 'dist-gui/windows_amd64'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entry = $archive.GetEntry('SDL2.dll')
            if ($null -eq $entry) { throw 'SDL2.dll is not in the archive' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $dest 'SDL2.dll'), $true)
          } finally { $archive.Dispose() }
          'SDL2.dll sha256: ' + (Get-FileHash -Algorithm SHA256 -Path (Join-Path $dest 'SDL2.dll')).Hash.ToLowerInvariant()
        if: steps.scope.outputs.run == 'true'
      - name: Build and run the probe next to SDL2.dll (dummy driver)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: scripts/gui-probe.sh windows/amd64
        if: steps.scope.outputs.run == 'true'
      - name: Library planting is ignored (garbage SDL2.dll on PATH and in the cwd; real DLL only beside the exe)
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dist = (Resolve-Path 'dist-gui/windows_amd64').Path
          $exe = Join-Path $dist 'mothdex-gui-probe.exe'
          $tmp = Join-Path $env:RUNNER_TEMP 'plant'
          $cwd = Join-Path $tmp 'cwd'; $pathdir = Join-Path $tmp 'pathdir'; $a = Join-Path $tmp 'A'; $b = Join-Path $tmp 'B'
          New-Item -ItemType Directory -Force -Path $cwd, $pathdir, $a, $b | Out-Null
          Set-Content -Path (Join-Path $cwd 'SDL2.dll') -Value 'not a PE file'
          Set-Content -Path (Join-Path $pathdir 'SDL2.dll') -Value 'not a PE file'
          $savedPath = $env:PATH
          # 1. The real DLL sits beside the exe; a garbage SDL2.dll is in the working directory and first on PATH.
          #    The loader must take the one beside the exe.
          Push-Location $cwd
          $env:PATH = "$pathdir;$savedPath"
          $out = (& $exe 2>&1 | Out-String); $code = $LASTEXITCODE
          $env:PATH = $savedPath; Pop-Location
          Write-Host $out
          if ($code -ne 0 -or $out -notmatch 'probe ok') { throw "case 1: exit $code, the DLL beside the exe was not used" }
          # 2. The exe has no DLL beside it; the real one is in the working directory and on PATH. LOAD_LIBRARY_SEARCH_
          #    APPLICATION_DIR|SYSTEM32 must not look there: the probe has to report SDL2 not found (exit 8).
          Copy-Item $exe $a
          Copy-Item (Join-Path $dist 'SDL2.dll') $b
          Push-Location $b
          $env:PATH = "$b;$savedPath"
          $out = (& (Join-Path $a 'mothdex-gui-probe.exe') 2>&1 | Out-String); $code = $LASTEXITCODE
          $env:PATH = $savedPath; Pop-Location
          Write-Host $out
          if ($code -ne 8) { throw "case 2: expected exit 8 (SDL2 not found), got ${code}: a DLL outside the application and system folders was loaded" }
          exit 0 # the last native command exited 8 on purpose: do not let PowerShell hand that to the step
        if: steps.scope.outputs.run == 'true'
      - name: --probe, the installer's eligibility check (the environment install.ps1 gives it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'dist-gui/windows_amd64').Path
          # install.ps1 starts the process with only SystemRoot, PATH=System32 and TEMP (T-70 IC-1) and waits 20 s (IC-10).
          function Invoke-Probe($exe) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new($exe, '--probe')
            $psi.UseShellExecute = $false; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
            $psi.Environment.Clear()
            $psi.Environment['SystemRoot'] = $env:SystemRoot
            $psi.Environment['PATH'] = "$env:SystemRoot\System32"
            $psi.Environment['TEMP'] = $env:TEMP
            $p = [System.Diagnostics.Process]::Start($psi)
            if (-not $p.WaitForExit(20000)) { $p.Kill(); throw 'the probe did not finish in 20 s' }
            [pscustomobject]@{ Code = $p.ExitCode; Out = $p.StandardOutput.ReadToEnd().Trim(); Err = $p.StandardError.ReadToEnd().Trim() }
          }
          # Eligible: the SDL2.dll is beside the executable.
          $r = Invoke-Probe (Join-Path $dist 'mothdex-gui-probe.exe')
          Write-Host "eligible: exit $($r.Code), stdout [$($r.Out)], stderr [$($r.Err)]"
          if ($r.Code -ne 0 -or $r.Out -notmatch '^sdl \d+\.\d+\.\d+$' -or $r.Err -ne '') { throw 'case 1: --probe did not say one line sdl X.Y.Z and exit 0' }
          # Not eligible: no SDL2.dll beside the executable. Exit 8, nothing on stdout, one clean line of at most 200 bytes.
          $alone = Join-Path $env:RUNNER_TEMP 'probe-alone'
          New-Item -ItemType Directory -Force -Path $alone | Out-Null
          Copy-Item (Join-Path $dist 'mothdex-gui-probe.exe') $alone
          $r = Invoke-Probe (Join-Path $alone 'mothdex-gui-probe.exe')
          Write-Host "not eligible: exit $($r.Code), stdout [$($r.Out)], stderr [$($r.Err)]"
          if ($r.Code -ne 8 -or $r.Out -ne '' -or $r.Err -eq '' -or $r.Err -match '[\r\n]' -or $r.Err -match '\p{Cc}' -or [Text.Encoding]::UTF8.GetByteCount($r.Err) -gt 200) {
            throw 'case 2: --probe without SDL2.dll did not exit 8 with one clean line of reason'
          }
        if: steps.scope.outputs.run == 'true'
      - name: go test -tags gui, run from the folder that holds SDL2.dll
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          GUI_REQUIRE_SDL: "1"
        run: |
          go test -c -tags gui -trimpath -o dist-gui/windows_amd64/sdl.test.exe ./internal/ui/gui/sdl
          cd dist-gui/windows_amd64 && ./sdl.test.exe -test.v -test.count=1
        if: steps.scope.outputs.run == 'true'
      - name: Plain LoadLibrary ignores the cwd and PATH once SDL is open (IC-8, SetDefaultDllDirectories)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          GUI_REQUIRE_SDL: "1"
        run: |
          # SDL loads vulkan-1, opengl32, XInput and hid later with a plain LoadLibrary. A DLL planted in the working
          # directory and on PATH must not be found, while the executable's folder and System32 still are.
          cd dist-gui/windows_amd64 && ./sdl.test.exe -test.v -test.count=1 -test.run '^TestPlainLoadLibraryIgnoresThePathAndTheWorkingFolderOnceSDLIsOpen$'
        if: steps.scope.outputs.run == 'true'
      - name: Size report
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          {
            echo "### GUI probe size (windows/amd64)"
            echo
            printf '%s\n' '```'
            ls -l dist-gui/windows_amd64
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
